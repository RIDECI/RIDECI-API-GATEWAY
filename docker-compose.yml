version: '3.9'

services:
  kong:
    build: .
    container_name: kong-dev
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_LISTEN: "0.0.0.0:8000 reuseport, 0.0.0.0:8443 ssl reuseport"
      
      URL_TRAVELS: ${URL_TRAVELS}
      URL_COMMUNICATION: ${URL_COMMUNICATION}
      URL_USERS: ${URL_USERS}
      URL_AUTH: ${URL_AUTH}
      URL_ADMIN: ${URL_ADMIN}
      URL_PROFILE: ${URL_PROFILE}
      URL_NOTIFICATIONS: ${URL_NOTIFICATIONS}
      URL_GEOLOCATIONS: ${URL_GEOLOCATIONS}
    
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8443:8443"
    
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"