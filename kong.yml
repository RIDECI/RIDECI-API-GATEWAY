_format_version: "3.0"
_transform: true

services:
  - name: ms-travels
    url: ${URL_TRAVELS}
    routes:
      - name: routes-travels
        paths: ["/travels"]
        strip_path: false

  - name: ms-geolocation
    url: ${URL_GEOLOCATIONS}
    routes:
      - name: routes-geolocation
        paths: ["/geolocations"]
        strip_path: false

  - name: ms-communication
    url: ${URL_COMMUNICATION}
    routes:
      - name: route-communication
        paths: ["/conversations"]
        strip_path: false
      - name: route-communication-reports
        paths: ["/reports"]
        strip_path: false
  
  - name: ms-users
    url: ${URL_USERS}
    routes:
      - name: route-users
        paths: ["/users"]
        strip_path: false

  - name: ms-authentication
    url: ${URL_AUTH}
    routes:
      - name: route-authentication
        paths: ["/auth"]
        strip_path: false
        
  - name: ms-administrator
    url: ${URL_ADMIN}
    routes:
      - name: route-administrator
        paths: ["/admin"]
        strip_path: false

  - name: ms-profile
    url: ${URL_PROFILE}
    routes:
      - name: route-profile
        paths: ["/profiles"]
        strip_path: false
        
  - name: ms-notifications
    url: ${URL_NOTIFICATIONS}
    routes:
      - name: route-notification
        paths: ["/notifications"]
        strip_path: false